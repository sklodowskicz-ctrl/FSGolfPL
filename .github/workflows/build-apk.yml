name: Build FS Golf PL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Zainstaluj platformę Android 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Zbuduj APK
        working-directory: Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Przygotuj plik APK
        run: |
          mkdir -p dist
          cp Android/app/build/outputs/apk/debug/app-debug.apk dist/FS-Golf-PL-0.7-debug.apk
      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: FS-Golf-PL-0.7-debug
          path: dist/FS-Golf-PL-0.7-debug.apk
          if-no-files-found: error
          retention-days: 14

