name: Build FS Golf PL Windows Overlay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Windows/**'
      - '.github/workflows/build-windows-overlay.yml'

permissions:
  contents: read

jobs:
  build-windows-overlay:
    runs-on: windows-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Ustaw .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Zbuduj samodzielny overlay
        run: dotnet publish Windows/FSGolfPL.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/WindowsOverlay
      - name: Test startu aplikacji
        shell: pwsh
        run: |
          & ".\dist\WindowsOverlay\FSGolfPL.exe" --smoke-test
          if ($process.ExitCode -ne 0) {
            throw "Overlay smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Zbierz log diagnostyczny
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'FSGolfPL\overlay.log'
          if (Test-Path -LiteralPath $log) {
            New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
            Copy-Item -LiteralPath $log -Destination 'diagnostics\overlay.log' -Force
          }
      - name: Udostępnij diagnostykę
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FSGolfPL-Windows-startup-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Udostępnij aplikację
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FSGolfPL-Windows-Overlay-v1-verified
          path: dist/WindowsOverlay/
          if-no-files-found: error
          retention-days: 14
