name: Build, test and release FS Golf PL Windows Overlay v3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-release-windows-v3.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Ustaw .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Zbuduj świeży Windows x64 Release
        run: dotnet publish Windows/FSGolfPL.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/WindowsOverlay
      - name: Sprawdź aktywność, pozycję i kliknięcia overlayu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class NativeWindowCheck {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X; public int Y; }
            public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int maxCount);
            [DllImport("user32.dll", SetLastError=true)] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll", EntryPoint="GetWindowLongPtrW")] public static extern IntPtr GetWindowLongPtr(IntPtr hWnd, int index);
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT point);
          }
          '@
          $log = Join-Path $env:LOCALAPPDATA 'FSGolfPL/overlay.log'
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'dist/WindowsOverlay/FSGolfPL.exe').Path
          $target = Start-Process -FilePath $exe -ArgumentList '--test-target' -PassThru -WindowStyle Normal
          $overlay = $null
          try {
            Start-Sleep -Seconds 2
            $overlay = Start-Process -FilePath $exe -PassThru -WindowStyle Normal
            $deadline = (Get-Date).AddSeconds(12)
            $target.Refresh()
            $overlay.Refresh()
            $readoutHandles = [System.Collections.Generic.List[System.IntPtr]]::new()
            $callback = [NativeWindowCheck+EnumWindowsProc]{
              param([System.IntPtr]$hWnd, [System.IntPtr]$lParam)
              $buffer = [System.Text.StringBuilder]::new(256)
              [void][NativeWindowCheck]::GetWindowText($hWnd, $buffer, $buffer.Capacity)
              if ($buffer.ToString() -eq 'FS Golf PL Readouts v3') { [void]$readoutHandles.Add($hWnd) }
              return $true
            }.GetNewClosure()
            do {
              $target.Refresh()
              $overlay.Refresh()
              [void][NativeWindowCheck]::EnumWindows($callback, [System.IntPtr]::Zero)
              if ($target.MainWindowHandle -ne [System.IntPtr]::Zero -and
                  $overlay.MainWindowHandle -ne [System.IntPtr]::Zero -and
                  $readoutHandles.Count -gt 0) { break }
              Start-Sleep -Milliseconds 350
            } while ((Get-Date) -lt $deadline)
            if ($target.HasExited -or $overlay.HasExited) { throw 'The FS Golf test target or overlay exited unexpectedly.' }
            if ($target.MainWindowHandle -eq [System.IntPtr]::Zero -or $overlay.MainWindowHandle -eq [System.IntPtr]::Zero -or $readoutHandles.Count -eq 0) {
              throw 'The test target, interactive controller, or translated readout window was not created.'
            }
            $titleBuffer = [System.Text.StringBuilder]::new(512)
            [void][NativeWindowCheck]::GetWindowText($overlay.MainWindowHandle, $titleBuffer, $titleBuffer.Capacity)
            if ($titleBuffer.ToString() -notmatch 'FS Golf PC 2.0 wykryty') { throw "FS Golf window detection failed: $($titleBuffer.ToString())" }
            $targetRect = New-Object NativeWindowCheck+RECT
            $overlayRect = New-Object NativeWindowCheck+RECT
            $readoutRect = New-Object NativeWindowCheck+RECT
            if (-not [NativeWindowCheck]::GetWindowRect($target.MainWindowHandle, [ref]$targetRect) -or
                -not [NativeWindowCheck]::GetWindowRect($overlay.MainWindowHandle, [ref]$overlayRect) -or
                -not [NativeWindowCheck]::GetWindowRect($readoutHandles[0], [ref]$readoutRect)) {
              throw 'Could not read test window geometry.'
            }
            if ([Math]::Abs(($overlayRect.Left - $targetRect.Left) - 18) -gt 3 -or
                [Math]::Abs(($overlayRect.Top - $targetRect.Top) - 18) -gt 3) {
              throw 'The interactive overlay did not follow the FS Golf test window position.'
            }
            $style = [NativeWindowCheck]::GetWindowLongPtr($overlay.MainWindowHandle, -16).ToInt64()
            if (($style -band 0x00C00000) -eq 0 -or ($style -band 0x00080000) -eq 0) {
              throw 'The controller does not have a movable caption and close system menu.'
            }
            $exStyle = [NativeWindowCheck]::GetWindowLongPtr($overlay.MainWindowHandle, -20).ToInt64()
            if (($exStyle -band 0x08000000) -ne 0 -or ($exStyle -band 0x00000008) -eq 0) {
              throw 'The controller is not mouse-active and always-on-top.'
            }
            $readoutExStyle = [NativeWindowCheck]::GetWindowLongPtr($readoutHandles[0], -20).ToInt64()
            if (($readoutExStyle -band 0x00080000) -eq 0 -or ($readoutExStyle -band 0x00000020) -eq 0) {
              throw 'The readout window is not configured for click-through.'
            }
            $probe = New-Object NativeWindowCheck+POINT
            $probe.X = $readoutRect.Left + 25
            $probe.Y = $readoutRect.Top + 25
            if ([NativeWindowCheck]::WindowFromPoint($probe) -ne $target.MainWindowHandle) {
              throw 'Mouse hit testing over the readout did not pass through to FS Golf.'
            }
            if (Test-Path -LiteralPath $log) { throw "Unexpected exception log: $(Get-Content -LiteralPath $log -Raw)" }
            Write-Host 'PASS: target detection, follow position, movable/closable controller style, topmost state, and click-through readout.'
          }
          finally {
            if ($null -ne $overlay -and -not $overlay.HasExited) { Stop-Process -Id $overlay.Id -Force }
            if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force }
          }
      - name: Sprawdź kontrolowane uruchomienie
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/WindowsOverlay/FSGolfPL.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "FSGolfPL smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Spakuj świeże pliki v3
        shell: pwsh
        run: |
          $zip = 'FSGolfPL-Windows-Overlay-v3.zip'
          Compress-Archive -Path 'dist/WindowsOverlay/*' -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq 'FSGolfPL.exe' -and $_.Length -gt 1000000 })) {
              throw 'The ZIP does not contain the fresh FSGolfPL.exe.'
            }
          } finally {
            $archive.Dispose()
          }
      - name: Utwórz osobny Release v3 z EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-overlay-v3
          target_commitish: main
          name: FS Golf PL Windows Overlay v3
          body: Fresh Windows x64 Release. The GitHub Actions test verified detection, positioning, hit-test pass-through, and an active window.
          draft: false
          prerelease: false
          generate_release_notes: false
          files: FSGolfPL-Windows-Overlay-v3.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
