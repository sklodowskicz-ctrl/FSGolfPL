name: Copy existing Windows Overlay v4 package to v5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-package:
    runs-on: windows-latest
    steps:
      - name: Copy the published v4 ZIP without rebuilding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'https://github.com/sklodowskicz-ctrl/FSGolfPL/releases/download/windows-overlay-v4-clean-20261002/FSGolfPL-Windows-Overlay-v4.zip'
          $v4 = 'FSGolfPL-Windows-Overlay-v4.zip'
          $v5 = 'FSGolfPL-Windows-Overlay-v5.zip'
          Invoke-WebRequest -Uri $source -OutFile $v4
          Copy-Item -LiteralPath $v4 -Destination $v5
          $sourceHash = (Get-FileHash -LiteralPath $v4 -Algorithm SHA256).Hash
          $copyHash = (Get-FileHash -LiteralPath $v5 -Algorithm SHA256).Hash
          if ($sourceHash -ne $copyHash) { throw 'The v5 copy is not byte-for-byte identical to v4.' }
          if ($sourceHash -ne 'EBF308DADD8BD301BA23AD504BE4A410D824A489C0357546FB14685B85C6BAF3') { throw "Downloaded v4 ZIP does not match the published asset digest: $sourceHash" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $v5).Path)
          try {
            $exe = $archive.Entries | Where-Object { $_.FullName -eq 'FSGolfPL.exe' -and $_.Length -gt 1000000 }
            if (-not $exe) { throw 'Copied ZIP does not contain FSGolfPL.exe.' }
            Write-Host "PASS: byte-identical copy; $($archive.Entries.Count) ZIP entries; EXE $($exe.Length) bytes; SHA256 $copyHash."
          } finally { $archive.Dispose() }
      - name: Publish the single v5 ZIP asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-overlay-v5-20261002
          target_commitish: main
          name: FS Golf PL Windows Overlay v5 (identical copy of v4)
          body: This is the already-published v4 ZIP copied byte-for-byte and renamed for v5. No rebuild or application code changes.
          draft: false
          prerelease: false
          generate_release_notes: false
          files: FSGolfPL-Windows-Overlay-v5.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
